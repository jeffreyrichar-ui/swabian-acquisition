items:
- question: Will my employees keep their jobs if I sell to Swabian Acquisition?
  answer: Keeping your team is the plan, not a concession. In a service business the people
    are most of what I am buying. I cannot promise any individual's future, and I will not pretend
    to, but who stays, who is told when, and how key people are retained are things we work
    out together before closing and put in writing.
- question: Do I have to stay on after the sale, and who runs the business if I leave?
  answer: 'Only as long as we agree, and that can be short. I do not run it day to day. I am
    the owner, and I put professional management in place: your existing team, a manager we
    hire with your input, or someone you help choose. Which route fits is one of the first things
    we discuss, because it decides how long you need to stay.'
- question: Will Swabian Acquisition keep my company's name?
  answer: My default is yes. A name that has been on trucks, invoices, and referrals for years
    is worth keeping, and I have no brand of my own to push. I am not folding it into a regional
    brand. If you feel strongly either way, we talk about it early and put the answer in writing
    before close.
- question: How long does it take to sell to Swabian Acquisition?
  answer: The first conversation takes about 30 minutes. Once I have basic financials, I put
    a written offer letter in front of you within a few weeks. If we agree, a confirmatory review
    follows, and we aim for a quick, professional closing within 90 days when both sides are
    ready. You set the pace, and if you want to wait a year, tell me and I will check back.
