items:
- question: Does Swabian Acquisition buy businesses outside the Treasure Valley?
  answer: 'No. I buy in the Treasure Valley and the wider southwest of Idaho: Ada, Canyon, Gem, Payette, Owyhee, Boise, Elmore and Washington counties. That is about a ninety minute drive from Boise, which is the point. I want to be able to get to the business in a morning, and I am not looking further afield than that.'
- question: What size and type of business is Swabian Acquisition looking for?
  answer: At least $1 million in annual revenue, with no upper limit, operating five or more
    years, preferably a B2B or commercial services company. Trades, field services, maintenance,
    testing, calibration, and similar work all fit. I will not buy restaurants, retail, franchises,
    startups, turnarounds, or businesses whose value is mostly the real estate.
