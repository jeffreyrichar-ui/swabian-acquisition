items:
- question: Does Swabian Acquisition pay referral or finder's fees to advisors?
  answer: Not to licensed advisors (CPAs, attorneys, bankers, wealth advisors) unless their
    client agrees in writing. Your duty runs to your client, and a fee from the buyer can complicate
    that. If your situation is unusual or you are unsure, ask us and we will give you a straight
    answer before anyone makes an introduction. Business brokers keep whatever arrangement they
    already have with their client.
- question: How should a CPA or attorney introduce a client to Swabian Acquisition?
  answer: Ask the client first, then send a one-line email to jeffrey.richardson@swabian.co
    with the business type, city, and rough revenue. No documents are needed. I sign a confidentiality
    agreement before seeing anything sensitive, keep the conversation between me and the client,
    and never contact employees, customers, or lenders without permission. You can stay involved
    or step back, as your client prefers.
