name: Deploy swabian.co

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Voice and registry gates
        run: npm run check
      - name: Build and validate output
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test the live site
        run: |
          set -e
          sleep 20
          curl -sSf -o /dev/null https://swabian.co/
          curl -sSf https://swabian.co/robots.txt | grep -q Sitemap
          curl -sSf https://swabian.co/llms.txt | grep -q "Swabian Acquisition"
          echo "live site responded correctly"
